name: Windows remote desktop
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: sky-workflow-windows
  cancel-in-progress: false
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Mark workflow startup time
        shell: pwsh
        run: Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'sky-workflow-started.txt') -Value ([DateTimeOffset]::UtcNow.ToString('o'))
      - name: Download verified WebDAV mount tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msi=Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          $zip=Join-Path $env:RUNNER_TEMP 'rclone-windows.zip'
          curl.exe -fsSL --retry 3 -o $msi https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
          if((Get-FileHash $msi -Algorithm SHA256).Hash -ne '073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a'){throw 'WinFsp checksum mismatch'}
          curl.exe -fsSL --retry 3 -o $zip https://github.com/rclone/rclone/releases/download/v1.76.0/rclone-v1.76.0-windows-amd64.zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash -ne '8b4fd2737ade4e70c057ef4a49deb7cffe94b0fb9d7587c189d149823f21a1dc'){throw 'rclone checksum mismatch'}
      - name: Enable IP forwarding
        shell: pwsh
        run: |
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name IPEnableRouter -Type DWord -Value 1
          Get-NetIPInterface -AddressFamily IPv4 | Where-Object { $_.ConnectionState -eq 'Connected' } | Set-NetIPInterface -Forwarding Enabled
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --advertise-exit-node
          hostname: sky-workflow-windows
      - name: Configure RDP
        shell: pwsh
        env:
          DESKTOP_PASSWORD: ${{ secrets.WINDOWS_DESKTOP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DESKTOP_PASSWORD)) { throw "请先设置 WINDOWS_DESKTOP_PASSWORD" }
          $secure = ConvertTo-SecureString $env:DESKTOP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name 'runneradmin' -Password $secure
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          $ts = Get-NetAdapter | Where-Object { $_.InterfaceDescription -like '*Tailscale*' } | Select-Object -First 1
          if (!$ts) { throw "找不到 Tailscale 网卡" }
          New-NetFirewallRule -DisplayName 'Tailscale RDP' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -InterfaceAlias $ts.Name | Out-Null
          tailscale ip -4
      - name: Mount shared AList drive
        shell: powershell
        timeout-minutes: 4
        continue-on-error: true
        env:
          SHARED_ALIST_USERNAME: ${{ secrets.SHARED_ALIST_USERNAME }}
          SHARED_ALIST_PASSWORD: ${{ secrets.SHARED_ALIST_PASSWORD }}
        run: '& "$env:GITHUB_WORKSPACE\sky-workflow-services\mount-share-windows.ps1"'
      - name: Restore Windows user profiles from AList
        shell: pwsh
        continue-on-error: true
        run: '& "$env:GITHUB_WORKSPACE\sky-workflow-services\persist-userdata-windows.ps1" -Mode Restore'
      - name: Load desktop shortcuts before app updates
        shell: pwsh
        continue-on-error: true
        run: |
          $desktop = [Environment]::GetFolderPath('Desktop')
          $shell = New-Object -ComObject WScript.Shell
          $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $targets = @{
            'QQ' = (Join-Path $env:ProgramFiles 'Tencent\QQNT\QQ.exe')
            '微信' = (Join-Path $env:ProgramFiles 'Tencent\WeChat\WeChat.exe')
            '哔哩哔哩' = (Join-Path $env:ProgramFiles '哔哩哔哩\哔哩哔哩.exe')
          }
          foreach ($name in $targets.Keys) {
            $path = Join-Path $desktop ($name + '.lnk')
            $link = $shell.CreateShortcut($path)
            $link.TargetPath = $targets[$name]
            $link.WorkingDirectory = Split-Path -Parent $targets[$name]
            $link.Save()
          }
          $chromeCandidates = @((Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),(Join-Path $pf86 'Google\Chrome\Application\chrome.exe'),(Join-Path $env:LOCALAPPDATA 'Google\Chrome\Application\chrome.exe'))
          $chrome = $chromeCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if ($chrome) {
            $sites = [ordered]@{ X='https://x.com/'; Google='https://www.google.com/'; YouTube='https://www.youtube.com/'; Facebook='https://www.facebook.com/'; 'xgcartoon.com'='https://www.xgcartoon.com/' }
            foreach ($site in $sites.GetEnumerator()) {
              $link = $shell.CreateShortcut((Join-Path $desktop ($site.Key + '.lnk')))
              $link.TargetPath = $chrome; $link.Arguments = '"' + $site.Value + '"'; $link.WorkingDirectory = Split-Path -Parent $chrome; $link.IconLocation = $chrome + ',0'; $link.Save()
            }
          }
      - name: Start background silent app installation
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $state = Join-Path $env:LOCALAPPDATA 'SkyWorkflow'
          New-Item -ItemType Directory -Force -Path $state | Out-Null
          Remove-Item -LiteralPath (Join-Path $state 'apps-install.status.json') -Force -ErrorAction SilentlyContinue
          foreach ($name in @('QQ','WeChat','Bilibili')) {
            $stateFile = Join-Path $state ("app-$name.json")
            [ordered]@{ name=$name; state='等待开始'; detail=''; updatedAt=[DateTimeOffset]::Now.ToString('o') } | ConvertTo-Json -Compress | Set-Content -LiteralPath $stateFile -Encoding utf8
          }
          Set-Content -LiteralPath (Join-Path $state 'apps-install.startedAt') -Value ([DateTimeOffset]::UtcNow.ToString('o'))
          $script = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\install-windows-apps.ps1'
          $arguments = '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "' + $script + '"'
          $proc = Start-Process -FilePath 'pwsh.exe' -ArgumentList $arguments -WindowStyle Hidden -RedirectStandardOutput (Join-Path $state 'apps-install.log') -RedirectStandardError (Join-Path $state 'apps-install-error.log') -PassThru
          Set-Content -LiteralPath (Join-Path $state 'apps-install.pid') -Value $proc.Id
          $ui = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\show-windows-app-install.ps1'
          $uiArgs = '-NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File "' + $ui + '"'
          Start-Process -FilePath 'pwsh.exe' -ArgumentList $uiArgs -WindowStyle Hidden | Out-Null
          Write-Host "Desktop shortcuts were loaded first; silent app updates started in background (PID $($proc.Id))."
      - name: Minimize initial utility windows
        shell: pwsh
        run: |
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class WindowTools { [DllImport("user32.dll")] public static extern bool ShowWindowAsync(IntPtr h, int n); }'
          for ($i=0; $i -lt 6; $i++) {
            Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowTitle -match '^(Performance Options|性能选项|System Properties|系统属性)$' } |
              ForEach-Object {
                $proc = $_
                [void]$proc.CloseMainWindow()
                Start-Sleep -Milliseconds 500
                $proc.Refresh()
                if (!$proc.HasExited -and $proc.MainWindowTitle -match '^(Performance Options|性能选项|System Properties|系统属性)$') {
                  Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                }
              }
            Get-Process -Name WindowsTerminal,powershell,pwsh,OpenConsole,tailscale-ipn -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero -and $_.MainWindowTitle -ne '应用后台安装' } |
              ForEach-Object { [void][WindowTools]::ShowWindowAsync($_.MainWindowHandle, 6) }
            Start-Sleep -Seconds 2
          }
      - name: Install Simplified Chinese typing component
        shell: pwsh
        timeout-minutes: 10
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'Language.Basic~~~zh-CN~0.0.1.0'
          $basicTyping = Get-WindowsCapability -Online -Name $name -ErrorAction Stop
          if ($basicTyping.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $name -ErrorAction Stop | Out-Null
          }
          $verified = Get-WindowsCapability -Online -Name $name -ErrorAction Stop
          if ($verified.State -ne 'Installed') { throw 'Simplified Chinese typing component is still missing' }
          Write-Host 'Simplified Chinese typing component is installed.'
      - name: Configure Simplified Chinese Pinyin and locale
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            $languages = New-WinUserLanguageList -Language 'zh-CN'
            $languages[0].InputMethodTips.Clear()
            $languages[0].InputMethodTips.Add('0804:00000804') | Out-Null
            $languages.Add('en-US') | Out-Null
            Set-WinUserLanguageList -LanguageList $languages -Force -ErrorAction Stop
            Set-WinDefaultInputMethodOverride -InputTip '0804:00000804' -ErrorAction Stop
            Write-Host 'Microsoft Pinyin is the default input method for the RDP user.'
          } catch { Write-Warning ('Chinese Pinyin input method was not applied: ' + $_.Exception.Message) }
          try { Set-WinUILanguageOverride -Language zh-CN -ErrorAction Stop } catch { Write-Warning ('UI language override unavailable until the language pack is installed.') }
          try { Set-WinSystemLocale -SystemLocale zh-CN -ErrorAction Stop } catch { Write-Warning ('System locale was not changed: ' + $_.Exception.Message) }
          try { Set-Culture zh-CN -ErrorAction Stop } catch { Write-Warning ('Culture was not changed: ' + $_.Exception.Message) }
          try { Set-WinHomeLocation -GeoId 45 -ErrorAction Stop } catch { Write-Warning ('Home location was not changed: ' + $_.Exception.Message) }
      - name: Dismiss startup dialogs after language setup
        shell: pwsh
        run: |
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class LateWindowTools { [DllImport("user32.dll")] public static extern bool ShowWindowAsync(IntPtr h, int n); }'
          $popupPattern = '^(Performance Options|性能选项|System Properties|系统属性)$'
          for ($i=0; $i -lt 15; $i++) {
            Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowTitle -match $popupPattern } |
              ForEach-Object {
                $proc = $_
                [void]$proc.CloseMainWindow()
                Start-Sleep -Milliseconds 500
                $proc.Refresh()
                if (!$proc.HasExited -and $proc.MainWindowTitle -match $popupPattern) {
                  Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                }
              }
            Get-Process -Name WindowsTerminal,powershell,pwsh,OpenConsole,tailscale-ipn -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero -and $_.MainWindowTitle -ne '应用后台安装' } |
              ForEach-Object { [void][LateWindowTools]::ShowWindowAsync($_.MainWindowHandle, 6) }
            Start-Sleep -Seconds 2
          }
      - name: Measure background app installation time
        shell: pwsh
        timeout-minutes: 32
        continue-on-error: true
        run: |
          $state = Join-Path $env:LOCALAPPDATA 'SkyWorkflow'
          $status = Join-Path $state 'apps-install.status.json'
          $startedFile = Join-Path $state 'apps-install.startedAt'
          $deadline = [DateTime]::UtcNow.AddMinutes(30)
          while ([DateTime]::UtcNow -lt $deadline) {
            if (Test-Path -LiteralPath $status) {
              try {
                $result = Get-Content -LiteralPath $status -Raw | ConvertFrom-Json
                if ($result.status -in @('complete','failed')) { break }
              } catch {}
            }
            Start-Sleep -Seconds 5
          }
          if ((Test-Path -LiteralPath $status) -and (Test-Path -LiteralPath $startedFile)) {
            $result = Get-Content -LiteralPath $status -Raw | ConvertFrom-Json
            $started = [DateTimeOffset]::Parse((Get-Content -LiteralPath $startedFile -Raw))
            $elapsed = [int]([DateTimeOffset]::UtcNow - $started).TotalSeconds
            Write-Host "App installation finished: $($result.status); elapsed=${elapsed}s; failed=$($result.failed -join ',')."
          } else { Write-Warning 'App installation did not finish within 30 minutes; desktop remains available and the progress window stays open.' }
      - name: Refresh installed app shortcuts
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $desktop = [Environment]::GetFolderPath('Desktop')
          $shell = New-Object -ComObject WScript.Shell
          $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $apps = @(
            @{ Name='QQ'; Candidates=@((Join-Path $env:ProgramFiles 'Tencent\QQNT\QQ.exe'),(Join-Path $pf86 'Tencent\QQNT\QQ.exe'),(Join-Path $env:LOCALAPPDATA 'Programs\Tencent\QQNT\QQ.exe'),(Join-Path $env:LOCALAPPDATA 'Tencent\QQNT\QQ.exe')) },
            @{ Name='微信'; Candidates=@((Join-Path $env:ProgramFiles 'Tencent\WeChat\WeChat.exe'),(Join-Path $pf86 'Tencent\WeChat\WeChat.exe'),(Join-Path $env:LOCALAPPDATA 'Tencent\WeChat\WeChat.exe'),(Join-Path $env:LOCALAPPDATA 'Programs\Tencent\WeChat\WeChat.exe')) },
            @{ Name='哔哩哔哩'; Candidates=@((Join-Path $env:ProgramFiles '哔哩哔哩\哔哩哔哩.exe'),(Join-Path $pf86 '哔哩哔哩\哔哩哔哩.exe'),(Join-Path $env:LOCALAPPDATA 'Programs\哔哩哔哩\哔哩哔哩.exe'),(Join-Path $env:LOCALAPPDATA 'Programs\bilibili\bilibili.exe')) }
          )
          foreach ($app in $apps) {
            $exe = $app.Candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if ($exe) {
              $link = $shell.CreateShortcut((Join-Path $desktop ($app.Name + '.lnk')))
              $link.TargetPath = $exe; $link.WorkingDirectory = Split-Path -Parent $exe; $link.Save()
            }
          }
      - name: Keep session available
        shell: pwsh
        run: |
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; using System.Text; public static class SessionUiTools { [DllImport("user32.dll")] public static extern bool ShowWindowAsync(IntPtr h, int n); [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l); [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n); [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h); }'
          $startedFile = Join-Path $env:RUNNER_TEMP 'sky-workflow-started.txt'
          $started = [DateTimeOffset]::Parse((Get-Content -LiteralPath $startedFile -Raw)).UtcDateTime
          $remaining = [Math]::Max(0, 21600 - [int]([DateTime]::UtcNow - $started).TotalSeconds)
          Write-Host "Workflow session age: $([int]([DateTime]::UtcNow - $started).TotalSeconds)s; keeping desktop available for $remaining more seconds."
          $deadline = [DateTime]::UtcNow.AddSeconds($remaining)
          while ([DateTime]::UtcNow -lt $deadline) {
            Get-Process -ErrorAction SilentlyContinue | ForEach-Object {
              $proc = $_
              if ($proc.MainWindowHandle -eq [IntPtr]::Zero) { return }
              $title = $proc.MainWindowTitle
              if ($title -eq '应用后台安装') { return }
              if ($title -match '^(System Properties|系统属性|Performance Options|性能选项)$') {
                [void][SessionUiTools]::PostMessage($proc.MainWindowHandle, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero)
              } elseif ($title -match '^(Administrator:|Windows Terminal|管理员:)' -or $proc.ProcessName -in @('WindowsTerminal','OpenConsole','powershell','pwsh','cmd')) {
                [void][SessionUiTools]::ShowWindowAsync($proc.MainWindowHandle, 6)
              }
            }
            Start-Sleep -Seconds 3
          }
      - name: Save Windows app profiles to AList
        if: always()
        shell: pwsh
        timeout-minutes: 15
        continue-on-error: true
        run: '& "$env:GITHUB_WORKSPACE\sky-workflow-services\persist-userdata-windows.ps1" -Mode Save'
      - name: Remove temporary Tailscale node
        if: always()
        shell: pwsh
        run: tailscale logout
