name: Windows remote desktop
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: sky-workflow-windows
  cancel-in-progress: false
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Configure Simplified Chinese display language
        shell: powershell
        timeout-minutes: 6
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Language -Language zh-CN -CopyToSettings -ErrorAction Stop
          Set-WinUserLanguageList -LanguageList (New-WinUserLanguageList zh-CN) -Force
          Set-WinUILanguageOverride -Language zh-CN
          Set-Culture zh-CN
          dism.exe /online /get-intl
      - name: Enable IP forwarding
        shell: pwsh
        run: |
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name IPEnableRouter -Type DWord -Value 1
          Get-NetIPInterface -AddressFamily IPv4 | Where-Object { $_.ConnectionState -eq 'Connected' } | Set-NetIPInterface -Forwarding Enabled
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --advertise-exit-node
          hostname: sky-workflow-windows
      - name: Configure RDP
        shell: pwsh
        env:
          DESKTOP_PASSWORD: ${{ secrets.WINDOWS_DESKTOP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DESKTOP_PASSWORD)) { throw "请先设置 WINDOWS_DESKTOP_PASSWORD" }
          $secure = ConvertTo-SecureString $env:DESKTOP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name 'runneradmin' -Password $secure
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          $ts = Get-NetAdapter | Where-Object { $_.InterfaceDescription -like '*Tailscale*' } | Select-Object -First 1
          if (!$ts) { throw "找不到 Tailscale 网卡" }
          New-NetFirewallRule -DisplayName 'Tailscale RDP' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -InterfaceAlias $ts.Name | Out-Null
          tailscale ip -4
      - name: Minimize initial utility windows
        shell: pwsh
        run: |
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class WindowTools { [DllImport("user32.dll")] public static extern bool ShowWindowAsync(IntPtr h, int n); }'
          for ($i=0; $i -lt 3; $i++) {
            Get-Process -Name WindowsTerminal,tailscale-ipn -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero } | ForEach-Object { [void][WindowTools]::ShowWindowAsync($_.MainWindowHandle, 6) }
            Start-Sleep -Seconds 2
          }
      - name: Keep session available
        shell: pwsh
        run: Start-Sleep -Seconds 21300
      - name: Remove temporary Tailscale node
        if: always()
        shell: pwsh
        run: tailscale logout
