name: Windows remote desktop
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: sky-workflow-windows
  cancel-in-progress: false
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Download verified WebDAV mount tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msi=Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          $zip=Join-Path $env:RUNNER_TEMP 'rclone-windows.zip'
          curl.exe -fsSL --retry 3 -o $msi https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
          if((Get-FileHash $msi -Algorithm SHA256).Hash -ne '073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a'){throw 'WinFsp checksum mismatch'}
          curl.exe -fsSL --retry 3 -o $zip https://github.com/rclone/rclone/releases/download/v1.76.0/rclone-v1.76.0-windows-amd64.zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash -ne '8b4fd2737ade4e70c057ef4a49deb7cffe94b0fb9d7587c189d149823f21a1dc'){throw 'rclone checksum mismatch'}
      - name: Enable IP forwarding
        shell: pwsh
        run: |
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name IPEnableRouter -Type DWord -Value 1
          Get-NetIPInterface -AddressFamily IPv4 | Where-Object { $_.ConnectionState -eq 'Connected' } | Set-NetIPInterface -Forwarding Enabled
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --advertise-exit-node
          hostname: sky-workflow-windows
      - name: Configure RDP
        shell: pwsh
        env:
          DESKTOP_PASSWORD: ${{ secrets.WINDOWS_DESKTOP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DESKTOP_PASSWORD)) { throw "请先设置 WINDOWS_DESKTOP_PASSWORD" }
          $secure = ConvertTo-SecureString $env:DESKTOP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name 'runneradmin' -Password $secure
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          $ts = Get-NetAdapter | Where-Object { $_.InterfaceDescription -like '*Tailscale*' } | Select-Object -First 1
          if (!$ts) { throw "找不到 Tailscale 网卡" }
          New-NetFirewallRule -DisplayName 'Tailscale RDP' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -InterfaceAlias $ts.Name | Out-Null
          tailscale ip -4
      - name: Install latest QQ, WeChat, Bilibili and desktop links
        shell: pwsh
        timeout-minutes: 18
        run: |
          $ErrorActionPreference = 'Stop'
          $downloads = Join-Path $env:RUNNER_TEMP 'desktop-apps'
          New-Item -ItemType Directory -Force -Path $downloads | Out-Null
          $failed = [System.Collections.Generic.List[string]]::new()
          $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')

          function Install-OfficialExe([string]$Name, [string]$Url, [string]$FileName, [string]$Switch) {
            try {
              if ($Url -notmatch '^https://(qqdl\.gtimg\.cn|dldir1v6\.qq\.com|dl\.hdslb\.com)/') { throw 'download URL host not allowed' }
              $path = Join-Path $downloads $FileName
              Invoke-WebRequest -Uri $Url -OutFile $path
              if ((Get-Item -LiteralPath $path).Length -lt 1MB) { throw 'installer download is unexpectedly small' }
              $signature = Get-AuthenticodeSignature -FilePath $path
              if ($signature.Status -ne 'Valid') { throw "installer signature status: $($signature.Status)" }
              $proc = Start-Process -FilePath $path -ArgumentList $Switch -Wait -PassThru
              if ($proc.ExitCode -notin @(0, 3010)) { throw "installer exit code $($proc.ExitCode)" }
              Write-Host "$Name installer completed."
            } catch {
              $failed.Add($Name)
              Write-Warning "$Name installation failed: $($_.Exception.Message)"
            }
          }

          try {
            $cfg = (Invoke-WebRequest -Uri 'https://cdn-go.cn/qq-web/im.qq.com_new/latest/rainbow/windowsConfig.js').Content
            $m = [regex]::Match($cfg, 'var params\s*=\s*(\{.*?\})\s*;')
            if (!$m.Success) { throw 'Tencent QQ latest download configuration was not found' }
            $qqUrl = [string](($m.Groups[1].Value | ConvertFrom-Json).ntDownloadX64Url)
            Install-OfficialExe 'QQ' $qqUrl 'QQ-latest-x64.exe' '/s'
          } catch {
            $failed.Add('QQ')
            Write-Warning "QQ latest link retrieval failed: $($_.Exception.Message)"
          }

          try {
            $page = (Invoke-WebRequest -Uri 'https://pc.weixin.qq.com/').Content
            $m = [regex]::Match($page, 'https://dldir1v6\.qq\.com/weixin/Universal/Windows/WeChatWin_[^""\s]+\.exe')
            if (!$m.Success) { throw 'WeChat Windows download link was not found on its official download page' }
            Install-OfficialExe 'WeChat' $m.Value 'WeChat-latest.exe' '/S'
          } catch {
            $failed.Add('WeChat')
            Write-Warning "WeChat latest link retrieval failed: $($_.Exception.Message)"
          }

          try {
            $page = (Invoke-WebRequest -Uri 'https://app.bilibili.com/index.html').Content
            $m = [regex]::Match($page, '<a[^>]+href="(https://dl\.hdslb\.com/mobile/fixed/bili_win/[^""]+)"[^>]+title="Windows客户端"')
            if (!$m.Success) { throw 'Bilibili Windows download link was not found on its official download center' }
            Install-OfficialExe 'Bilibili' $m.Groups[1].Value 'Bilibili-latest.exe' '/S'
          } catch {
            $failed.Add('Bilibili')
            Write-Warning "Bilibili latest link retrieval failed: $($_.Exception.Message)"
          }

          $desktop = [Environment]::GetFolderPath('Desktop')
          $shell = New-Object -ComObject WScript.Shell
          $shortcutRoots = @("$env:ProgramData\Microsoft\Windows\Start Menu\Programs", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs") | Where-Object { Test-Path -LiteralPath $_ }
          $apps = @(
            @{ Name = 'QQ'; Pattern = '(^|\\)QQ(\.lnk)?        shell: pwsh
        run: |
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class WindowTools { [DllImport("user32.dll")] public static extern bool ShowWindowAsync(IntPtr h, int n); }'
          for ($i=0; $i -lt 3; $i++) {
            Get-Process -Name WindowsTerminal,tailscale-ipn -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero } | ForEach-Object { [void][WindowTools]::ShowWindowAsync($_.MainWindowHandle, 6) }
            Start-Sleep -Seconds 2
          }
      - name: Mount shared AList drive
        shell: powershell
        timeout-minutes: 4
        continue-on-error: true
        env:
          SHARED_ALIST_USERNAME: ${{ secrets.SHARED_ALIST_USERNAME }}
          SHARED_ALIST_PASSWORD: ${{ secrets.SHARED_ALIST_PASSWORD }}
        run: '& "$env:GITHUB_WORKSPACE\sky-workflow-services\mount-share-windows.ps1"'
      - name: Configure Simplified Chinese display language
        shell: powershell
        timeout-minutes: 6
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Language -Language zh-CN -CopyToSettings -ErrorAction Stop
          Set-WinUserLanguageList -LanguageList (New-WinUserLanguageList zh-CN) -Force
          Set-WinUILanguageOverride -Language zh-CN
          Set-Culture zh-CN
          dism.exe /online /get-intl
      - name: Keep session available
        shell: pwsh
        run: Start-Sleep -Seconds 21300
      - name: Remove temporary Tailscale node
        if: always()
        shell: pwsh
        run: tailscale logout
; Exe = 'QQ.exe'; Roots = @("$env:ProgramFiles\Tencent", "$pf86\Tencent", "$env:LOCALAPPDATA\Tencent", "$env:LOCALAPPDATA\Programs\Tencent") },
            @{ Name = '微信'; Pattern = '(微信|WeChat)'; Exe = 'WeChat.exe'; Roots = @("$env:ProgramFiles\Tencent", "$pf86\Tencent", "$env:LOCALAPPDATA\Tencent", "$env:LOCALAPPDATA\Programs\Tencent") },
            @{ Name = '哔哩哔哩'; Pattern = '(哔哩哔哩|Bilibili)'; Exe = '哔哩哔哩.exe'; Roots = @("$env:ProgramFiles\哔哩哔哩", "$pf86\哔哩哔哩", "$env:LOCALAPPDATA\Programs\哔哩哔哩", "$env:LOCALAPPDATA\Programs\bilibili", "$env:LOCALAPPDATA\Bilibili") }
          )
          foreach ($app in $apps) {
            $lnk = Get-ChildItem -Path $shortcutRoots -Filter '*.lnk' -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.BaseName -match $app.Pattern } | Select-Object -First 1
            if ($lnk) {
              Copy-Item -LiteralPath $lnk.FullName -Destination (Join-Path $desktop ($app.Name + '.lnk')) -Force
              continue
            }
            $exe = Get-ChildItem -Path ($app.Roots | Where-Object { Test-Path -LiteralPath $_ }) -Filter $app.Exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) {
              $link = $shell.CreateShortcut((Join-Path $desktop ($app.Name + '.lnk')))
              $link.TargetPath = $exe.FullName
              $link.WorkingDirectory = $exe.DirectoryName
              $link.Save()
            } else {
              Write-Warning "$($app.Name) app shortcut not created: executable not found."
            }
          }

          $sites = [ordered]@{
            'X' = 'https://x.com/'
            'Google' = 'https://www.google.com/'
            'YouTube' = 'https://www.youtube.com/'
            'Facebook' = 'https://www.facebook.com/'
            'xgcartoon.com' = 'https://www.xgcartoon.com/'
          }
          foreach ($site in $sites.GetEnumerator()) {
            Set-Content -LiteralPath (Join-Path $desktop ($site.Key + '.url')) -Value ("[InternetShortcut]" + [Environment]::NewLine + "URL=$($site.Value)") -Encoding ASCII
          }
          Write-Host 'Desktop website shortcuts created.'
          if ($failed.Count) { Write-Warning ("Some app installations did not complete: " + ($failed -join ', ')) }
      - name: Minimize initial utility windows
        shell: pwsh
        run: |
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class WindowTools { [DllImport("user32.dll")] public static extern bool ShowWindowAsync(IntPtr h, int n); }'
          for ($i=0; $i -lt 3; $i++) {
            Get-Process -Name WindowsTerminal,tailscale-ipn -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero } | ForEach-Object { [void][WindowTools]::ShowWindowAsync($_.MainWindowHandle, 6) }
            Start-Sleep -Seconds 2
          }
      - name: Mount shared AList drive
        shell: powershell
        timeout-minutes: 4
        continue-on-error: true
        env:
          SHARED_ALIST_USERNAME: ${{ secrets.SHARED_ALIST_USERNAME }}
          SHARED_ALIST_PASSWORD: ${{ secrets.SHARED_ALIST_PASSWORD }}
        run: '& "$env:GITHUB_WORKSPACE\sky-workflow-services\mount-share-windows.ps1"'
      - name: Configure Simplified Chinese display language
        shell: powershell
        timeout-minutes: 6
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Language -Language zh-CN -CopyToSettings -ErrorAction Stop
          Set-WinUserLanguageList -LanguageList (New-WinUserLanguageList zh-CN) -Force
          Set-WinUILanguageOverride -Language zh-CN
          Set-Culture zh-CN
          dism.exe /online /get-intl
      - name: Keep session available
        shell: pwsh
        run: Start-Sleep -Seconds 21300
      - name: Remove temporary Tailscale node
        if: always()
        shell: pwsh
        run: tailscale logout
