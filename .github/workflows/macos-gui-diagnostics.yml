name: macOS desktop diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: sky-macos-test
      - name: Start native screen sharing
        shell: bash
        env:
          DESKTOP_PASSWORD: ${{ secrets.MACOS_VNC_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DESKTOP_PASSWORD"
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -clientopts -setvnclegacy -vnclegacy yes -clientopts -setvncpw -vncpw "$DESKTOP_PASSWORD" -restart -agent
          tailscale ip -4
          echo '--- console, screen and service ---'
          stat -f '%Su' /dev/console
          launchctl print gui/$(id -u) | head -12 || true
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true
          echo '--- tailscale status ---'
          tailscale status
          echo '--- tailscale connectivity ---'
          tailscale netcheck || true
          sleep 15

