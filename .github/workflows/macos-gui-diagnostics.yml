name: macOS desktop diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - name: Inspect GUI session
        shell: bash
        run: |
          set +e
          echo '--- identity ---'
          id
          echo '--- console owner ---'
          stat -f '%Su %Sg' /dev/console
          echo '--- GUI processes ---'
          ps -axo user,pid,comm | grep -E 'WindowServer|loginwindow|Finder|Dock|screensharingd' | grep -v grep
          echo '--- displays ---'
          system_profiler SPDisplaysDataType 2>/dev/null | head -100
          echo '--- active user session ---'
          launchctl print gui/$(id -u) 2>&1 | head -35
          echo '--- screenshot status ---'
          screencapture -x /tmp/desktop-diagnostic.png 2>&1
          if test -f /tmp/desktop-diagnostic.png; then sips -g pixelWidth -g pixelHeight /tmp/desktop-diagnostic.png; fi
