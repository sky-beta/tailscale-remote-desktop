name: Linux SSH
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: sky-workflow-linux
  cancel-in-progress: false
jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify Linux services
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/alist.tar.gz" https://github.com/AlistGo/alist/releases/download/v3.66.0/alist-linux-amd64.tar.gz
          echo '06a2ab394c1bce4d29b84021192aa75350f556bd1a1e98d321ad760170b5ed31  '"$RUNNER_TEMP/alist.tar.gz" | sha256sum -c -
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/xray.zip" https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip
          echo 'b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82  '"$RUNNER_TEMP/xray.zip" | sha256sum -c -
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/cloudflared" https://github.com/cloudflare/cloudflared/releases/download/2026.11.0/cloudflared-linux-amd64
          echo '51f7c68b57ed7269164075d7e789efce5b59355982f06392deeb037d982a51fd  '"$RUNNER_TEMP/cloudflared" | sha256sum -c -
      - name: Enable IP forwarding
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --advertise-exit-node
          hostname: sky-workflow-linux
      - name: Configure SSH public key
        shell: bash
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [[ "$SSH_PUBLIC_KEY" =~ ^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256)[[:space:]] ]] || { echo "请设置有效的 SSH_PUBLIC_KEY"; exit 1; }
          [[ "$SSH_PUBLIC_KEY" != *$'\n'* && "$SSH_PUBLIC_KEY" != *$'\r'* ]] || exit 1
          chmod go-w "$HOME"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PUBLIC_KEY" > "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo usermod -p "$(openssl rand -base64 48 | openssl passwd -6 -stdin)" runner
          printf '%s\n' 'PasswordAuthentication no' 'KbdInteractiveAuthentication no' | sudo tee /etc/ssh/sshd_config.d/00-workflow-publickey.conf >/dev/null
          sudo sshd -t
          sudo systemctl enable --now ssh
          sudo systemctl restart ssh
          tailscale ip -4
          echo "SSH 用户名 runner"
          printf 'Current user: '; id -un
          printf 'HOME: %s\n' "$HOME"
          getent passwd runner | cut -d: -f1,6,7
          ls -ld "$HOME" "$HOME/.ssh" "$HOME/.ssh/authorized_keys"
          ssh-keygen -lf "$HOME/.ssh/authorized_keys"
          sudo sshd -T | grep -E '^(authorizedkeysfile|pubkeyauthentication|strictmodes) '
      - name: Restore AList and start VLESS WebSocket
        shell: bash
        continue-on-error: true
        env:
          ALIST_RESTORE_JSON: ${{ secrets.ALIST_RESTORE_JSON }}
          ALIST_BOOTSTRAP_PASSWORD: ${{ secrets.ALIST_BOOTSTRAP_PASSWORD }}
          VLESS_WORKFLOW_UUID: ${{ secrets.VLESS_WORKFLOW_UUID }}
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/sky-workflow-services/start-services.sh"
      - name: Keep session available
        shell: bash
        run: sleep 21300
      - name: Remove temporary Tailscale node
        if: always()
        run: sudo tailscale logout || true
