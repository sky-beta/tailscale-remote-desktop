name: mac-rdp-server authenticated test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - name: Install mac-rdp-server
        run: brew install DawidAdamski/mac-rdp-server/mac-rdp-server
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: sky-mac-rdp-test
          args: --accept-dns=false
      - name: Install and run local-only RDP with SSH access
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJrhu47ZxhbHPLL2hqstOfndVvT+KKZ2oJexWmqBnQ1X administrator@hong' >> "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo launchctl enable system/com.openssh.sshd
          sudo launchctl kickstart system/com.openssh.sshd || true
          mac-rdp-server --check-permissions || true
          mac-rdp-server --bind-addr 127.0.0.1 >/tmp/mac-rdp.log 2>&1 &
          echo "--- test ready ---"
          tailscale ip -4
          sleep 180
          tail -30 /tmp/mac-rdp.log


