name: mac-rdp-server isolated test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Install mac-rdp-server
        run: brew install DawidAdamski/mac-rdp-server/mac-rdp-server
      - name: Check permissions and local test pattern
        shell: bash
        run: |
          set -u
          echo '--- version ---'
          mac-rdp-server --version || true
          echo '--- permissions ---'
          mac-rdp-server --check-permissions || true
          echo '--- local test pattern ---'
          mac-rdp-server --bind-addr 127.0.0.1 --test-pattern 1280x720 >/tmp/mac-rdp-test.log 2>&1 &
          pid=$!
          for n in $(seq 1 20); do
            if nc -z 127.0.0.1 3389 2>/dev/null; then echo 'LOCAL_RDP_PORT_OPEN'; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then echo 'SERVER_EXITED'; break; fi
            sleep 1
          done
          cat /tmp/mac-rdp-test.log
          kill "$pid" 2>/dev/null || true
