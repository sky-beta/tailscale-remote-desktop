name: macOS remote desktop
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: sky-workflow-macos-v3
  cancel-in-progress: false
jobs:
  desktop:
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Mark workflow startup time
        shell: bash
        run: mkdir -p "$HOME/Library/Logs/SkyWorkflow" && date -u +%Y-%m-%dT%H:%M:%SZ > "$HOME/Library/Logs/SkyWorkflow/workflow-started"
      - name: Install mac-rdp-server
        run: brew install DawidAdamski/mac-rdp-server/mac-rdp-server cloudflared
      - name: Enable IP forwarding
        run: |
          sudo sysctl -w net.inet.ip.forwarding=1
          sudo sysctl -w net.inet6.ip6.forwarding=1
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --advertise-exit-node --accept-dns=false
          hostname: sky-workflow-macos
      - name: Configure private remote desktop
        shell: bash
        run: |
          set -euo pipefail
          sudo networksetup -setdnsservers Ethernet Empty
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJrhu47ZxhbHPLL2hqstOfndVvT+KKZ2oJexWmqBnQ1X administrator@hong' >> "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo launchctl enable system/com.openssh.sshd
          sudo launchctl kickstart system/com.openssh.sshd || true
          mac-rdp-server --check-permissions || true
          tailscale ip -4
      - name: Start remote desktop and tunnel
        shell: bash
        env:
          TUNNEL_TOKEN: ${{ secrets.MACOS_REMOTE_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail
          log_dir="$HOME/Library/Logs/SkyWorkflow"
          mkdir -p "$log_dir"
          nohup cloudflared tunnel --no-autoupdate run >"$log_dir/cloudflared.log" 2>&1 < /dev/null &
          echo $! > "$log_dir/cloudflared.pid"
          nohup mac-rdp-server --bind-addr 127.0.0.1 >"$log_dir/mac-rdp-server.log" 2>&1 < /dev/null &
          echo $! > "$log_dir/mac-rdp-server.pid"
          sleep 2
          kill -0 "$(cat "$log_dir/mac-rdp-server.pid")"
          kill -0 "$(cat "$log_dir/cloudflared.pid")"
          echo 'Remote desktop and tunnel are running before app installation.'
      - name: Mount shared AList drive
        shell: bash
        timeout-minutes: 4
        continue-on-error: true
        env:
          SHARED_ALIST_USERNAME: ${{ secrets.SHARED_ALIST_USERNAME }}
          SHARED_ALIST_PASSWORD: ${{ secrets.SHARED_ALIST_PASSWORD }}
        run: python3 "$GITHUB_WORKSPACE/sky-workflow-services/mount-share-macos.py"
      - name: Restore macOS user profiles from AList
        shell: bash
        continue-on-error: true
        run: python3 "$GITHUB_WORKSPACE/sky-workflow-services/persist-userdata-macos.py" restore
      - name: Load desktop shortcuts before app updates
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          desktop="$HOME/Desktop"
          mkdir -p "$desktop"
          ln -sfn /Applications/QQ.app "$desktop/QQ.app"
          ln -sfn /Applications/WeChat.app "$desktop/WeChat.app"
          ln -sfn /Applications/哔哩哔哩.app "$desktop/哔哩哔哩.app"
          python3 - <<'PY'
          import pathlib, plistlib
          desktop = pathlib.Path.home() / "Desktop"
          sites = {
              "X": "https://x.com/",
              "Google": "https://www.google.com/",
              "YouTube": "https://www.youtube.com/",
              "Facebook": "https://www.facebook.com/",
              "xgcartoon.com": "https://www.xgcartoon.com/",
          }
          for name, url in sites.items():
              (desktop / f"{name}.webloc").write_bytes(plistlib.dumps({"URL": url}))
          PY
          echo 'Saved app and website shortcuts are loaded before background installs.'
      - name: Start background silent app installation
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          log_dir="$HOME/Library/Logs/SkyWorkflow"
          mkdir -p "$log_dir"
          rm -f "$log_dir/apps-install.status"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$log_dir/apps-install.startedAt"
          osascript -e 'display notification "QQ、微信和哔哩哔哩将在后台静默更新，桌面快捷方式已加载。" with title "桌面应用更新"' || true
          nohup /bin/bash "$GITHUB_WORKSPACE/.github/scripts/install-macos-apps.sh" >"$log_dir/apps-install.log" 2>&1 < /dev/null &
          echo $! > "$log_dir/apps-install.pid"
          echo "QQ, WeChat, and Bilibili installation started in the background (PID $(cat "$log_dir/apps-install.pid"))."
      - name: Create desktop links
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          desktop="$HOME/Desktop"
          mkdir -p "$desktop"
          for app in /Applications/QQ.app /Applications/WeChat*.app /Applications/微信*.app /Applications/bilibili*.app /Applications/Bilibili*.app /Applications/哔哩哔哩*.app; do
            if [[ -d "$app" ]]; then ln -sfn "$app" "$desktop/$(basename "$app")"; fi
          done
          python3 - <<'PY'
          import pathlib, plistlib
          desktop = pathlib.Path.home() / "Desktop"
          sites = {
              "X": "https://x.com/",
              "Google": "https://www.google.com/",
              "YouTube": "https://www.youtube.com/",
              "Facebook": "https://www.facebook.com/",
              "xgcartoon.com": "https://www.xgcartoon.com/",
          }
          for name, url in sites.items():
              (desktop / f"{name}.webloc").write_bytes(plistlib.dumps({"URL": url}))
          PY
          echo "Desktop website shortcuts created."
      - name: Measure background app installation time
        shell: bash
        timeout-minutes: 32
        continue-on-error: true
        run: |
          set -euo pipefail
          log_dir="$HOME/Library/Logs/SkyWorkflow"
          status="$log_dir/apps-install.status"
          started="$log_dir/apps-install.startedAt"
          deadline=$((SECONDS + 1800))
          while [[ $SECONDS -lt $deadline ]]; do
            if [[ -f "$status" ]] && grep -q '^status=complete$' "$status"; then break; fi
            sleep 5
          done
          if [[ -f "$status" && -f "$started" ]] && grep -q '^status=complete$' "$status"; then
            start_epoch="$(date -j -f '%Y-%m-%dT%H:%M:%SZ' "$(cat "$started")" '+%s')"
            now_epoch="$(date -u '+%s')"
            elapsed=$((now_epoch - start_epoch))
            cat "$status"
            echo "App installation elapsed: ${elapsed}s"
          else
            echo '::warning::App installation did not finish within 30 minutes; desktop remains available.'
          fi
      - name: Keep session available
        shell: bash
        run: |
          start_epoch="$(date -j -f '%Y-%m-%dT%H:%M:%SZ' "$(cat "$HOME/Library/Logs/SkyWorkflow/workflow-started")" '+%s')"
          now_epoch="$(date -u '+%s')"
          remaining=$((21600 - (now_epoch - start_epoch)))
          (( remaining > 0 )) || remaining=0
          echo "Workflow age: $((now_epoch - start_epoch))s; keeping desktop for ${remaining}s."
          sleep "$remaining"
      - name: Save macOS app profiles to AList
        if: always()
        shell: bash
        timeout-minutes: 15
        continue-on-error: true
        run: python3 "$GITHUB_WORKSPACE/sky-workflow-services/persist-userdata-macos.py" save
      - name: Remove temporary Tailscale node
        if: always()
        run: sudo tailscale logout || true
