name: macOS remote desktop
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: sky-workflow-macos
  cancel-in-progress: false
jobs:
  desktop:
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
      - name: Enable IP forwarding
        run: |
          sudo sysctl -w net.inet.ip.forwarding=1
          sudo sysctl -w net.inet6.ip6.forwarding=1
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --advertise-exit-node
          hostname: sky-workflow-macos
      - name: Configure Screen Sharing
        shell: bash
        env:
          DESKTOP_PASSWORD: ${{ secrets.MACOS_VNC_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DESKTOP_PASSWORD" || { echo "请先设置 MACOS_VNC_PASSWORD"; exit 1; }
          test "${#DESKTOP_PASSWORD}" -le 8 || { echo "macOS VNC 密码最多 8 个字符"; exit 1; }
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -clientopts -setvnclegacy -vnclegacy yes -clientopts -setvncpw -vncpw "$DESKTOP_PASSWORD" -restart -agent
          tailscale ip -4
      - name: Keep session available and restart
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
        run: |
          sleep 21480
          gh workflow run macos.yml --repo "$GH_REPO" --ref "$GH_REF"


      - name: Remove temporary Tailscale node
        if: always()
        run: sudo tailscale logout || true
