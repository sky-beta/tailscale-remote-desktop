name: macOS remote desktop
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: sky-workflow-macos-v3
  cancel-in-progress: false
jobs:
  desktop:
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install mac-rdp-server
        run: brew install DawidAdamski/mac-rdp-server/mac-rdp-server cloudflared
      - name: Enable IP forwarding
        run: |
          sudo sysctl -w net.inet.ip.forwarding=1
          sudo sysctl -w net.inet6.ip6.forwarding=1
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --advertise-exit-node --accept-dns=false
          hostname: sky-workflow-macos
      - name: Configure private remote desktop
        shell: bash
        run: |
          set -euo pipefail
          sudo networksetup -setdnsservers Ethernet Empty
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJrhu47ZxhbHPLL2hqstOfndVvT+KKZ2oJexWmqBnQ1X administrator@hong' >> "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo launchctl enable system/com.openssh.sshd
          sudo launchctl kickstart system/com.openssh.sshd || true
          mac-rdp-server --check-permissions || true
          tailscale ip -4
      - name: Install latest QQ, WeChat, Bilibili and desktop links
        shell: bash
        timeout-minutes: 20
        run: |
          set -u
          failures=()
          desktop="$HOME/Desktop"
          mkdir -p "$desktop"

          if brew update && brew install --cask qq; then
            if [[ -d /Applications/QQ.app ]]; then ln -sfn /Applications/QQ.app "$desktop/QQ.app"; fi
          else
            failures+=("QQ")
            echo "::warning::QQ installation failed; continuing to keep remote desktop available."
          fi

          install_official_dmg() {
            local label="$1" page="$2" url_pattern="$3"
            local url temp mount app app_base
            url="$(curl -fsSL --retry 3 "$page" | grep -oE "$url_pattern" | head -n 1 || true)"
            if [[ -z "$url" ]]; then echo "::warning::$label download link not found on official page"; return 1; fi
            temp="$(mktemp -d)"
            mount="$temp/mount"
            mkdir -p "$mount"
            if ! curl -fsSL --retry 3 "$url" -o "$temp/app.dmg"; then rm -rf "$temp"; return 1; fi
            if ! hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$temp/app.dmg" >/dev/null; then rm -rf "$temp"; return 1; fi
            app="$(find "$mount" -maxdepth 4 -type d -name '*.app' -print -quit)"
            if [[ -z "$app" ]]; then hdiutil detach "$mount" -quiet || true; rm -rf "$temp"; return 1; fi
            app_base="$(basename "$app")"
            if ! ditto "$app" "/Applications/$app_base"; then hdiutil detach "$mount" -quiet || true; rm -rf "$temp"; return 1; fi
            hdiutil detach "$mount" -quiet || true
            rm -rf "$temp"
            ln -sfn "/Applications/$app_base" "$desktop/$label.app"
          }

          if ! install_official_dmg '微信' 'https://mac.weixin.qq.com/' 'https://dldir1v6\.qq\.com/weixin/Universal/Mac/WeChatMac_[^" ]+\.dmg'; then failures+=("WeChat"); fi
          if ! install_official_dmg '哔哩哔哩' 'https://app.bilibili.com/index.html' 'https://dl\.hdslb\.com/mobile/fixed/pc_electron_mac/bili_mac\.dmg'; then failures+=("Bilibili"); fi

          python3 - <<'PY'
          import pathlib, plistlib
          desktop = pathlib.Path.home() / "Desktop"
          sites = {
              "X": "https://x.com/",
              "Google": "https://www.google.com/",
              "YouTube": "https://www.youtube.com/",
              "Facebook": "https://www.facebook.com/",
              "xgcartoon.com": "https://www.xgcartoon.com/",
          }
          for name, url in sites.items():
              (desktop / f"{name}.webloc").write_bytes(plistlib.dumps({"URL": url}))
          PY
          echo "Desktop website shortcuts created."
      - name: Mount shared AList drive
        shell: bash
        timeout-minutes: 4
        continue-on-error: true
        env:
          SHARED_ALIST_USERNAME: ${{ secrets.SHARED_ALIST_USERNAME }}
          SHARED_ALIST_PASSWORD: ${{ secrets.SHARED_ALIST_PASSWORD }}
        run: python3 "$GITHUB_WORKSPACE/sky-workflow-services/mount-share-macos.py"
      - name: Keep session available
        shell: bash
        env:
          TUNNEL_TOKEN: ${{ secrets.MACOS_REMOTE_TUNNEL_TOKEN }}
        run: |
          cloudflared tunnel --no-autoupdate run >/tmp/cloudflared-mac.log 2>&1 &
          mac-rdp-server --bind-addr 127.0.0.1 >/tmp/mac-rdp-server.log 2>&1 &
          sleep 21300
      - name: Remove temporary Tailscale node
        if: always()
        run: sudo tailscale logout || true
