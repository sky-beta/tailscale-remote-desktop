name: Windows FUSE WebDAV mount test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Test WinFsp and rclone mount
        shell: powershell
        env:
          SHARED_ALIST_USERNAME: ${{ secrets.SHARED_ALIST_USERNAME }}
          SHARED_ALIST_PASSWORD: ${{ secrets.SHARED_ALIST_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msi=Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          $zip=Join-Path $env:RUNNER_TEMP 'rclone.zip'
          curl.exe -fsSL --retry 3 -o $msi https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
          if((Get-FileHash $msi -Algorithm SHA256).Hash -ne '073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a'){throw 'WinFsp checksum mismatch'}
          curl.exe -fsSL --retry 3 -o $zip https://github.com/rclone/rclone/releases/download/v1.76.0/rclone-v1.76.0-windows-amd64.zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash -ne '8b4fd2737ade4e70c057ef4a49deb7cffe94b0fb9d7587c189d149823f21a1dc'){throw 'rclone checksum mismatch'}
          $p=Start-Process msiexec.exe -ArgumentList @('/i',('"'+$msi+'"'),'/qn','/norestart') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "WinFsp installer exit $($p.ExitCode)"}
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'rc')
          $rc=(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'rc') -Recurse -Filter rclone.exe | Select-Object -First 1).FullName
          $env:RCLONE_CONFIG_SKYSHARE_TYPE='webdav'
          $env:RCLONE_CONFIG_SKYSHARE_URL='https://striking-rebecka-wxj3837-0de393a2.koyeb.app/alist/dav/'
          $env:RCLONE_CONFIG_SKYSHARE_VENDOR='other'
          $env:RCLONE_CONFIG_SKYSHARE_USER=$env:SHARED_ALIST_USERNAME
          $env:RCLONE_CONFIG_SKYSHARE_PASS=(& $rc obscure $env:SHARED_ALIST_PASSWORD)
          $log=Join-Path $env:RUNNER_TEMP 'rclone.log'
          $proc=Start-Process -FilePath $rc -WindowStyle Hidden -ArgumentList @('mount','skyshare:','Z:','--vfs-cache-mode','writes','--log-file',('"'+$log+'"')) -PassThru
          for($i=0;$i -lt 30;$i++){if(Test-Path 'Z:\'){break};if($proc.HasExited){throw 'rclone mount exited'};Start-Sleep 2}
          if(-not(Test-Path 'Z:\')){throw 'WebDAV drive did not appear'}
          'WINDOWS_WEBDAV_MOUNTED'